# บริการที่ backend ต้องใช้ตอนเริ่มระบบ: Postgres (ข้อมูล + /health ต้องต่อ DB ได้) และ
# MinIO (ตอน boot backend สร้าง bucket เก็บรูป ถ้าต่อไม่ได้ backend จะไม่ขึ้น)
# ติดตั้งครั้งเดียวตอนสร้างคลัสเตอร์ ไม่ได้ deploy ทุก build เหมือนตัว API
#
# รหัสผ่านทั้งหมดอยู่ใน Secret `petpaws-env` ซึ่งไม่ได้เก็บใน git (Gitleaks จับได้ตอนเคยใส่ไว้ในไฟล์นี้)
# สร้างจากไฟล์ในเครื่องก่อน apply ไฟล์นี้:
#   cp k8s/petpaws-env.example k8s/petpaws-env.env   (แก้ค่าใน .env ซึ่งถูก gitignore ไว้)
#   kubectl create secret generic petpaws-env --from-env-file=k8s/petpaws-env.env
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petpaws-db
spec:
  replicas: 1
  selector:
    matchLabels: { app: petpaws-db }
  template:
    metadata:
      labels: { app: petpaws-db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: petpaws }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: petpaws-env, key: POSTGRES_PASSWORD } }
            - { name: POSTGRES_DB, value: petpaws }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata:
  name: petpaws-db
spec:
  selector: { app: petpaws-db }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petpaws-minio
spec:
  replicas: 1
  selector:
    matchLabels: { app: petpaws-minio }
  template:
    metadata:
      labels: { app: petpaws-minio }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          # ในคลัสเตอร์ดึงจาก quay.io ไม่ได้ (เน็ตในแลป) จึงโหลด image จากเครื่องเข้าไปด้วย kind load
          imagePullPolicy: IfNotPresent
          args: [server, /data]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: petpaws-env, key: S3_ACCESS_KEY_ID } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: petpaws-env, key: S3_SECRET_ACCESS_KEY } }
          ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: petpaws-minio
spec:
  selector: { app: petpaws-minio }
  ports: [{ port: 9000 }]
