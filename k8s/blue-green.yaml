# Blue/Green: มี Deployment 2 ชุด (blue, green) รันพร้อมกันตลอด แต่ Service `petpaws`
# ส่งทราฟฟิกไปแค่สีเดียวตาม selector `color` ตอน deploy จะอัปเดตสีที่ไม่ได้ใช้งาน
# ทดสอบผ่าน Service ประจำสีนั้นก่อน (smoke test) แล้วค่อยสลับ selector ของ `petpaws`
# ครั้งแรกทั้งสองสีใช้ image ตัวเดียวกัน pipeline จะเปลี่ยน image ให้ทีละสีเอง
#
# readinessProbe เช็คแค่ว่าแอปเปิดพอร์ต 3000 แล้ว (tcpSocket) ส่วนการเช็คว่าแอปทำงานถูกต้อง
# (/health ต่อฐานข้อมูลได้) เป็นหน้าที่ของ smoke test ใน pipeline ก่อนสลับทราฟฟิก
# ถ้าให้ probe เช็ค /health ด้วย release ที่พังจะค้างที่ rollout จนหมดเวลา แทนที่ smoke test จะเป็นตัวจับ
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petpaws-blue
spec:
  replicas: 1
  selector:
    matchLabels: { app: petpaws-api, color: blue }
  template:
    metadata:
      labels: { app: petpaws-api, color: blue }
    spec:
      containers:
        - name: app
          image: localhost:5001/petpaws-api:initial
          envFrom: [{ secretRef: { name: petpaws-env } }]
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petpaws-green
spec:
  replicas: 1
  selector:
    matchLabels: { app: petpaws-api, color: green }
  template:
    metadata:
      labels: { app: petpaws-api, color: green }
    spec:
      containers:
        - name: app
          image: localhost:5001/petpaws-api:initial
          envFrom: [{ secretRef: { name: petpaws-env } }]
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 5
---
# Service หลักที่ผู้ใช้เรียก สลับสีด้วย selector.color
apiVersion: v1
kind: Service
metadata:
  name: petpaws
spec:
  selector: { app: petpaws-api, color: blue }
  ports: [{ port: 8080, targetPort: 3000 }]
---
# Service ประจำสี ใช้ทำ smoke test สีใหม่ตรง ๆ ก่อนสลับทราฟฟิกจริง
apiVersion: v1
kind: Service
metadata:
  name: petpaws-blue
spec:
  selector: { app: petpaws-api, color: blue }
  ports: [{ port: 8080, targetPort: 3000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: petpaws-green
spec:
  selector: { app: petpaws-api, color: green }
  ports: [{ port: 8080, targetPort: 3000 }]
